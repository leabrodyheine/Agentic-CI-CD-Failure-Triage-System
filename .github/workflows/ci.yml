name: CI

# Disabled for this portfolio project so GitHub Actions does not run or send
# workflow-failure notifications. Re-enable by restoring the triggers below.
on: []
# on:
#   push:
#     branches: [main]
#   pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest
